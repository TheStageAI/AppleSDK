<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" width="900" height="682" role="img" aria-label="One conversational turn">
  <style>
  .bg{fill:#131313}
  .dot{fill:#1F1F1F}
  .card{fill:#1A1A1A;stroke:#303030;stroke-width:1}
  .card-accent{fill:#1F1714;stroke:#FF885A;stroke-width:1.5}
  .card-hi{fill:#FFF844;stroke:#FFF844;stroke-width:1.5}
  .card-muted{fill:#161616;stroke:#242424;stroke-width:1}
  .h{fill:#FFFFFF;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  .b{fill:#646464;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px}
  .m{fill:#6F6F6F;font:11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  .hi-t{fill:#131313;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  .hi-b{fill:#131313;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px;opacity:.72}
  .hi-m{fill:#3D3A10;font:11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  .ttl{fill:#FFFFFF;font:500 20px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.8px}
  .sub{fill:#646464;font:400 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px}
  .edge{stroke:#4A4A4A;stroke-width:1.5;fill:none}
  .ah{fill:#4A4A4A}
  .edge-d{stroke:#4A4A4A;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
  .el{fill:#646464;font:400 10.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.2px}
  .badge{fill:#242424;stroke:#303030}
  .badge-t{fill:#8A8A8A;font:500 10px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.2px}
  .num{fill:#646464;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  </style>
  <defs>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle class="dot" cx="1" cy="1" r="1"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="900" height="682" rx="14"/>
  <rect width="900" height="682" rx="14" fill="url(#dots)"/>
  <text class="ttl" x="28" y="40">One conversational turn</text>
  <text class="sub" x="28" y="62">What the agent does between the user starting to speak and the reply finishing. Each box is a state you can show in your UI.</text>
  <rect class="card" x="28.0" y="92" width="378.0" height="113" rx="14"/>
  <text class="h" x="46.0" y="123.0"><tspan class="num">01 / </tspan>listening</text>
  <text class="b" x="46.0" y="143.0">Mic is open, user is speaking.</text>
  <text class="b" x="46.0" y="161.0">Live text arrives on partial_transcripts.</text>
  <text class="m" x="46.0" y="185.0">user_request_partial</text>
  <rect class="card" x="494.0" y="92" width="378.0" height="113" rx="14"/>
  <text class="h" x="512.0" y="123.0"><tspan class="num">02 / </tspan>thinking</text>
  <text class="b" x="512.0" y="143.0">Turn is final. The reply has</text>
  <text class="b" x="512.0" y="161.0">not started yet.</text>
  <text class="m" x="512.0" y="185.0">user_request · transcripts</text>
  <rect class="card" x="28.0" y="263" width="378.0" height="129" rx="14"/>
  <text class="h" x="46.0" y="311.0"><tspan class="num">03 / </tspan>tool_calling</text>
  <text class="b" x="46.0" y="331.0">Only if the model called a tool.</text>
  <text class="m" x="46.0" y="355.0">tool_started · tool_ended</text>
  <rect class="badge" x="322.8" y="295.0" width="65.2" height="20" rx="10.0"/>
  <text class="badge-t" x="355.4" y="308.6" text-anchor="middle">optional</text>
  <rect class="card-accent" x="494.0" y="263" width="378.0" height="129" rx="14"/>
  <text class="h" x="512.0" y="294.0"><tspan class="num">04 / </tspan>speaking</text>
  <text class="b" x="512.0" y="314.0">Audio is playing. The user can</text>
  <text class="b" x="512.0" y="332.0">interrupt at any point.</text>
  <text class="m" x="512.0" y="356.0">response_delta · tts_chunks</text>
  <text class="m" x="512.0" y="372.0">playback_started</text>
  <rect class="card" x="28.0" y="450" width="378.0" height="113" rx="14"/>
  <text class="h" x="46.0" y="481.0"><tspan class="num">05 / </tspan>idle / listening</text>
  <text class="b" x="46.0" y="501.0">Back to waiting, or straight</text>
  <text class="b" x="46.0" y="519.0">into the next turn.</text>
  <text class="m" x="46.0" y="543.0">response_done · playback_ended</text>
  <path class="edge" d="M412.0,148.5 L488.0,148.5" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="140.5" text-anchor="middle">user stops</text>
  <path class="edge" d="M683.0,210 V227 H217.0 V255" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="221" text-anchor="middle">first token</text>
  <path class="edge" d="M412.0,327.5 L488.0,327.5" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="319.5" text-anchor="middle">reply streams</text>
  <path class="edge" d="M683.0,397 V414 H217.0 V442" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="408" text-anchor="middle">audio drained</text>
  <rect class="card-hi" x="28" y="593" width="844" height="71" rx="14"/>
  <text class="hi-t" x="46" y="624.0">speaking ends when the speaker drains — not when synthesis finishes</text>
  <text class="hi-b" x="46" y="644.0">Drive a “done” cue from playback_ended; the last tts_chunk arrives earlier.</text>
</svg>
