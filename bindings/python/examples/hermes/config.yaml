# Hermes Agent voice on TheStage models: merge into ~/.hermes/config.yaml.
# Start the server first: thestage-sdk serve
#
# Speech-to-text and text-to-speech only. Keep your own `model:` section: Hermes needs a
# chat model with at least 64K tokens of context, and the on-device packs hold 1,256.

tts:
  provider: openai
  openai:
    base_url: http://127.0.0.1:8000/v1
    model: tts-1           # any name; the server's --tts answers
    voice: dave            # NeuTTS voices: paul, dave, jo

stt:
  provider: openai
  openai:
    base_url: http://127.0.0.1:8000/v1
    api_key: local         # required for base_url to be used; any value
    model: whisper-1       # any name; the server's --asr answers
