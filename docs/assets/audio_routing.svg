<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 589" width="900" height="589" role="img" aria-label="Audio in and out">
  <style>
  .bg{fill:#131313}
  .dot{fill:#1F1F1F}
  .card{fill:#1A1A1A;stroke:#303030;stroke-width:1}
  .card-accent{fill:#1F1714;stroke:#FF885A;stroke-width:1.5}
  .card-hi{fill:#FFF844;stroke:#FFF844;stroke-width:1.5}
  .card-muted{fill:#161616;stroke:#242424;stroke-width:1}
  .h{fill:#FFFFFF;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  .b{fill:#646464;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px}
  .m{fill:#6F6F6F;font:11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  .hi-t{fill:#131313;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  .hi-b{fill:#131313;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px;opacity:.72}
  .hi-m{fill:#3D3A10;font:11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  .ttl{fill:#FFFFFF;font:500 20px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.8px}
  .sub{fill:#646464;font:400 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px}
  .edge{stroke:#4A4A4A;stroke-width:1.5;fill:none}
  .ah{fill:#4A4A4A}
  .edge-d{stroke:#4A4A4A;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
  .el{fill:#646464;font:400 10.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.2px}
  .badge{fill:#242424;stroke:#303030}
  .badge-t{fill:#8A8A8A;font:500 10px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.2px}
  .num{fill:#646464;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  </style>
  <defs>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle class="dot" cx="1" cy="1" r="1"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="900" height="589" rx="14"/>
  <rect width="900" height="589" rx="14" fill="url(#dots)"/>
  <text class="ttl" x="28" y="40">Audio in and out</text>
  <text class="sub" x="28" y="62">What sits between the microphone and the models, and between the models and the speaker.</text>
  <rect class="card" x="28.0" y="92" width="389.0" height="131" rx="14"/>
  <text class="h" x="46.0" y="141.0">Microphone</text>
  <text class="b" x="46.0" y="161.0">Device capture at its native rate.</text>
  <text class="m" x="46.0" y="185.0">or your own PCM source</text>
  <rect class="card-accent" x="483.0" y="92" width="389.0" height="131" rx="14"/>
  <text class="h" x="501.0" y="123.0">Echo cancellation</text>
  <text class="b" x="501.0" y="143.0">Removes what the speaker is</text>
  <text class="b" x="501.0" y="161.0">playing, so the agent does not</text>
  <text class="b" x="501.0" y="179.0">hear itself.</text>
  <text class="m" x="501.0" y="203.0">AEC</text>
  <rect class="card" x="28.0" y="281" width="389.0" height="113" rx="14"/>
  <text class="h" x="46.0" y="312.0">Resample</text>
  <text class="b" x="46.0" y="332.0">To whatever rate the model</text>
  <text class="b" x="46.0" y="350.0">declares it needs.</text>
  <text class="m" x="46.0" y="374.0">never relabel a buffer</text>
  <rect class="card" x="483.0" y="281" width="389.0" height="113" rx="14"/>
  <text class="h" x="501.0" y="321.0">Models</text>
  <text class="b" x="501.0" y="341.0">VAD, wake word, ASR.</text>
  <text class="m" x="501.0" y="365.0">each declares its rate</text>
  <rect class="card" x="28.0" y="452" width="389.0" height="113" rx="14"/>
  <text class="h" x="46.0" y="483.0">Playback</text>
  <text class="b" x="46.0" y="503.0">Streams TTS audio out, and feeds</text>
  <text class="b" x="46.0" y="521.0">the same samples to AEC.</text>
  <text class="m" x="46.0" y="545.0">reference signal</text>
  <rect class="card-muted" x="483.0" y="452" width="389.0" height="113" rx="14"/>
  <text class="h" x="501.0" y="483.0">Speaker</text>
  <text class="b" x="501.0" y="503.0">Barge-in cancels playback</text>
  <text class="b" x="501.0" y="521.0">mid-sentence.</text>
  <text class="m" x="501.0" y="545.0">playback_ended</text>
  <path class="edge" d="M423.0,157.5 L477.0,157.5" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="149.5" text-anchor="middle">raw</text>
  <path class="edge" d="M677.5,228 V245 H222.5 V273" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="239" text-anchor="middle">clean</text>
  <path class="edge" d="M423.0,337.5 L477.0,337.5" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="329.5" text-anchor="middle">frames</text>
  <path class="edge" d="M677.5,399 V416 H222.5 V444" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="410" text-anchor="middle">meanwhile</text>
  <path class="edge" d="M423.0,508.5 L477.0,508.5" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="500.5" text-anchor="middle">speaker</text>
</svg>
