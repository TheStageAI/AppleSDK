name: voice_agent
description: "Voice Agent — TheStage AI SDK (native orchestration)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  # SF-style glyphs for CupertinoIcons (without this, icons render as "?").
  cupertino_icons: ^1.0.8
  # This example lives inside the SDK repo, so it links the plugin by local
  # path. In your own app, depend on it from GitHub instead — see the
  # "Flutter (iOS)" section of the SDK README for the git: dependency.
  thestage_apple_sdk:
    git:
      url: https://github.com/TheStageAI/AppleSDK.git
      path: plugin/thestage_apple_sdk
      ref: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
