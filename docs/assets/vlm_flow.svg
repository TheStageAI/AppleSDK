<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 513" width="900" height="513" role="img" aria-label="How an image becomes text">
  <style>
  .bg{fill:#131313}
  .dot{fill:#1F1F1F}
  .card{fill:#1A1A1A;stroke:#303030;stroke-width:1}
  .card-accent{fill:#1F1714;stroke:#FF885A;stroke-width:1.5}
  .card-hi{fill:#FFF844;stroke:#FFF844;stroke-width:1.5}
  .card-muted{fill:#161616;stroke:#242424;stroke-width:1}
  .h{fill:#FFFFFF;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  .b{fill:#646464;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px}
  .m{fill:#6F6F6F;font:11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  .hi-t{fill:#131313;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  .hi-b{fill:#131313;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px;opacity:.72}
  .hi-m{fill:#3D3A10;font:11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  .ttl{fill:#FFFFFF;font:500 20px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.8px}
  .sub{fill:#646464;font:400 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.35px}
  .edge{stroke:#4A4A4A;stroke-width:1.5;fill:none}
  .ah{fill:#4A4A4A}
  .edge-d{stroke:#4A4A4A;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
  .el{fill:#646464;font:400 10.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.2px}
  .badge{fill:#242424;stroke:#303030}
  .badge-t{fill:#8A8A8A;font:500 10px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.2px}
  .num{fill:#646464;font:500 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-0.56px}
  </style>
  <defs>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle class="dot" cx="1" cy="1" r="1"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="900" height="513" rx="14"/>
  <rect width="900" height="513" rx="14" fill="url(#dots)"/>
  <text class="ttl" x="28" y="40">How an image becomes text</text>
  <text class="sub" x="28" y="62">One pack, one call. The image is encoded on device and answered by the same decoder that serves text.</text>
  <rect class="card" x="28.0" y="92" width="375.0" height="131" rx="14"/>
  <text class="h" x="46.0" y="124.0"><tspan class="num">01 / </tspan>Image + prompt</text>
  <text class="b" x="46.0" y="144.0">One or more images, plus what</text>
  <text class="b" x="46.0" y="162.0">you want done with them.</text>
  <text class="m" x="46.0" y="186.0">caption · question · OCR</text>
  <text class="m" x="46.0" y="202.0">· extract fields</text>
  <rect class="card-accent" x="497.0" y="92" width="375.0" height="131" rx="14"/>
  <text class="h" x="515.0" y="123.0"><tspan class="num">02 / </tspan>Vision encoder</text>
  <text class="b" x="515.0" y="143.0">Runs once per image. This is the</text>
  <text class="b" x="515.0" y="161.0">part that makes the first token</text>
  <text class="b" x="515.0" y="179.0">slower than a text-only prompt.</text>
  <text class="m" x="515.0" y="203.0">counts toward TTFT</text>
  <rect class="card" x="28.0" y="281" width="375.0" height="113" rx="14"/>
  <text class="h" x="46.0" y="312.0"><tspan class="num">03 / </tspan>Decoder</text>
  <text class="b" x="46.0" y="332.0">Generates the answer token by</text>
  <text class="b" x="46.0" y="350.0">token, with the same knobs as LLM.</text>
  <text class="m" x="46.0" y="374.0">temperature 0 for OCR</text>
  <path class="edge" d="M409.0,157.5 L491.0,157.5" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="149.5" text-anchor="middle">encoded</text>
  <path class="edge" d="M684.5,228 V245 H215.5 V273" marker-end="url(#ah)"/>
  <text class="el" x="450.0" y="239" text-anchor="middle">visual context</text>
  <rect class="card-hi" x="28" y="424" width="844" height="71" rx="14"/>
  <text class="hi-t" x="46" y="455.0">Streaming here is a prompt stream, not audio</text>
  <text class="hi-b" x="46" y="475.0">infer_stream yields token deltas like the LLM page, not TTS chunks — render them into the same text view.</text>
</svg>
